# MQTT cho ARS (cài vào /etc/mosquitto/conf.d/ars.conf bởi install_ubuntu.sh)
#   1883  chỉ trong máy (ingest, bridge, ars sim) — không cần mật khẩu
#   1884  mạng LAN — clicker Wi-Fi (ESP32), cần tài khoản trong /etc/mosquitto/ars_passwd
#   9001  WebSocket, chỉ trong máy — Apache chuyển tiếp từ /mqtt (clicker Wi-Fi qua Internet, gateway USB qua trình duyệt)
per_listener_settings true

listener 1883 127.0.0.1
allow_anonymous true

listener 1884
allow_anonymous false
password_file /etc/mosquitto/ars_passwd
acl_file /etc/mosquitto/ars_acl

listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/ars_passwd
acl_file /etc/mosquitto/ars_acl
